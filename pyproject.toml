[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-agent"
version = "0.1.0"
description = "Study project: Argus Agent"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["argus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

